name = "edgelink-worker"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

# Domain kustom Worker. 1stdev.link = utama; link.1stnear.com tetap aktif (redirect 301 + API lama).
routes = [
  { pattern = "1stdev.link", custom_domain = true },
  { pattern = "www.1stdev.link", custom_domain = true },
  { pattern = "link.1stnear.com", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"
BASE_URL = "https://1stdev.link"
DOMAIN_REDIRECT = "on"
EMAIL_FROM = "1stdev.link Security <no-reply@otp.1stdev.link>"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "edgelink-db"
database_id = "b4e3365e-f879-4dcb-bf54-308abcaab3ff"

# KV Namespace Binding
[[kv_namespaces]]
binding = "KV"
id = "3592113e2791453081cb2d9b32a85ffa"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "edgelink-media"
